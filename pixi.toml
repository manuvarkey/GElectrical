# Development environment for GElectrical (conda-forge via pixi).
# conda-forge provides prebuilt GTK3/PyGObject and all scientific deps on
# Windows, Linux and macOS, avoiding the gvsbuild/MSYS2 build steps.
#
#   pixi install        # create .pixi/envs/default
#   pixi run start      # launch the application
#   pixi run smoke      # end-to-end check through the GTK window
#   pixi run headless x.gepro  # open, analyse, export without GTK

[workspace]
name = "gelectrical"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = "3.14.*"
# GUI stack
gtk3 = ">=3.24"
pygobject = "*"
pycairo = "*"
adwaita-icon-theme = "*"
librsvg = "*"  # gdk-pixbuf SVG loader for the element icons
# Analysis. pandapower itself comes from PyPI (see [pypi-dependencies]);
# its compiled and pure-Python dependencies come from conda-forge here.
numpy = "<2.5"  # pandapower 3.5.6 requirements mirrored here
numba = "*"
scipy = ">=1.15"
pandas = "2.3.*"
networkx = ">=3.6,<4"
shapely = "*"
matplotlib = "*"
packaging = ">=26,<27"
tqdm = ">=4.68,<5"
colorama = "==0.4.6"
deepdiff = ">=9.1,<10"
geojson = ">=3.3,<4"
typing_extensions = ">=4.16,<5"
pandera-base = ">=0.32,<1"
# Reporting / IO. WeasyPrint itself comes from PyPI (see [pypi-dependencies]);
# its native libraries (Pango, HarfBuzz, fontconfig) and compiled Python
# dependencies come from conda-forge here.
pango = "*"
cffi = "*"
pillow = "*"
fonttools = ">=4.59.2"
brotli-python = "*"
zopfli = "*"
pydyf = ">=0.11"
tinycss2 = ">=1.5"
cssselect2 = ">=0.8"
pyphen = "*"
tinyhtml5 = ">=2.0.0b1"
jinja2 = "*"
openpyxl = "*"
appdirs = "*"

# Pure-Python packages taken from PyPI through pixi (locked in pixi.lock),
# ADR 0015 and ADR 0016. Return them to conda-forge once the feedstocks
# publish these versions.
[pypi-dependencies]
pandapower = "==3.5.6"
# Same version as the official weasyprint-windows-onedir executable (ADR 0016).
weasyprint = "==70.0"

[activation]
scripts = ["tools/pixi_activate.sh"]

[target.win-64.activation]
scripts = ["tools/pixi_activate.bat"]

[tasks]
start = "python gelectrical_launcher.py"
smoke = "python tools/smoke_test.py"
headless = "python tools/headless_run.py"

# Test feature (milestone M1): pytest for the regression baseline.
# Shares the default solve group, so the test environment has exactly the
# same package versions as the default environment.
[feature.test.dependencies]
pytest = "*"

[feature.test.tasks]
test = "pytest tests"
test-engine = "pytest tests/engine tests/test_symbols_extents.py"
test-headless = "pytest tests/test_headless_baseline.py"
baseline-capture = "python tools/baseline/capture.py"
build-test-projects = "python tools/baseline/build_projects.py"

[environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
