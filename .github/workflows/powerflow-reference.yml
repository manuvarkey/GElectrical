name: Power-flow reference test

on:
  push:
    branches:
      - master
    paths:
      - "gelectrical/**"
      - "tests/**"
      - ".github/workflows/powerflow-reference.yml"
  pull_request:
    paths:
      - "gelectrical/**"
      - "tests/**"
      - ".github/workflows/powerflow-reference.yml"
  workflow_dispatch:

jobs:
  powerflow-reference:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system libraries for GTK imports
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository1.0-dev libgtk-3-dev pkg-config python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "pandas==2.2.2" "scipy==1.13.1" "networkx==3.3" "numba==0.60.0" "pandapower==2.14.9" "pycairo" "PyGObject==3.42.2" "appdirs" "mako" "matplotlib" "jinja2" "weasyprint" "openpyxl" "shapely" "pytest"

      - name: Run analytical power-flow reference test
        run: python -m pytest -q tests/test_powerflow_reference.py
