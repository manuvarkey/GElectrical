name: quality

# Milestone M1: smoke test and regression baseline on the legacy GTK code.
# The legacy MainWindow needs a display: xvfb-run on Linux; the Windows
# runner has an interactive desktop session.
# Milestone M6: npm workspaces (modern/, packages/engineering-ui) checks.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (smoke + regression baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.85.0
          environments: test
          locked: true
          cache: true

      - name: Smoke test
        run: xvfb-run -a pixi run -e test smoke

      - name: Headless run (no display)
        run: env -u DISPLAY pixi run -e test headless sample_files/sample.gepro --out ${{ runner.temp }}/headless-run

      - name: Regression baseline (legacy GTK and headless engine), engine tests
        run: xvfb-run -a pixi run -e test test -v -rw
        env:
          GELECTRICAL_BASELINE_CAPTURE: ${{ runner.temp }}/baseline-capture
          GELECTRICAL_HEADLESS_CAPTURE: ${{ runner.temp }}/headless-capture

      - name: Upload capture on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-capture-linux
          path: |
            ${{ runner.temp }}/baseline-capture
            ${{ runner.temp }}/headless-capture
          if-no-files-found: ignore

  windows:
    name: Windows (smoke, engine tests)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.85.0
          environments: default test
          locked: true
          cache: true

      - name: Smoke test
        run: pixi run smoke

      - name: Engine tests (headless)
        run: pixi run -e test test-engine

      - name: Service and protocol tests (headless backend)
        run: pixi run -e test test-services

      - name: Headless run
        run: pixi run -e test headless sample_files/sample.gepro --out ${{ runner.temp }}/headless-run

  frontend:
    name: Frontend (npm workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (Storybook story tests)
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Formatting
        run: npm run format:check

      - name: Dependency boundary
        run: npm run check:boundaries

      - name: Licences
        run: npm run check:licences

      - name: Tool tests
        run: npm run test:tools

      - name: Type check
        run: npm run typecheck

      - name: Vitest (unit, Storybook stories with a11y)
        run: npm test

      - name: Build EngineeringUI and app
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
