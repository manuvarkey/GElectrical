name: Pandapower JSON import tests

on:
  push:
    branches:
      - feature/pandapower-json-import
  pull_request:
    paths:
      - "gelectrical/__init__.py"
      - "gelectrical/interface/mainwindow.glade"
      - "gelectrical/model/pandapower_import.py"
      - "gelectrical/view/pandapowerimport.py"
      - "tests/test_pandapower_import.py"
      - "tests/test_pandapower_import_gtk.py"
      - ".github/workflows/pandapower-json-import.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install GTK runtime for headless smoke tests
        run: sudo apt-get update && sudo apt-get install -y gir1.2-gtk-3.0 python3-gi python3-pandas xvfb
      - name: Run GTK dialog smoke tests under Xvfb
        run: xvfb-run -a /usr/bin/python3 tests/test_pandapower_import_gtk.py
      - name: Compile changed Python modules
        run: python -m compileall -q gelectrical/__init__.py gelectrical/model/pandapower_import.py gelectrical/view/pandapowerimport.py
      - name: Run Pandapower JSON import tests
        run: python -m pytest -q tests/test_pandapower_import.py
